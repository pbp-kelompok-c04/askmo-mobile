# This is a basic workflow to help you get started with Actions
name: Release

# Controls when the workflow will run
on:
  # Trigger on pushes to master only, plus manual run
  push:
    branches:
      - master
  workflow_dispatch:

# Permissions needed for creating releases
permissions:
  contents: write

jobs:
  releases:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: version
        run: |
          echo "version=$(awk -F ': ' '/^version:/{print $2; exit}' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      # Optional: fail fast if required secrets are missing
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            echo "ERROR: Missing secret GOOGLE_CLIENT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "ERROR: Missing secret GEMINI_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_JKS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "ERROR: Missing keystore secrets KEY_JKS and/or KEY_PASSWORD"
            exit 1
          fi

      - name: Decode keystore
        run: echo "${{ secrets.KEY_JKS }}" | base64 -d > android/app/release-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEY_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=release
          storeFile=release-keystore.jks
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://lessyarta-kamali-askmo.pbp.cs.ui.ac.id/ \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Jakarta' date +'%A %d-%m-%Y %T WIB')" >> "$GITHUB_OUTPUT"

      - name: Generate unique tag
        id: tag
        run: echo "tag=v${{ steps.version.outputs.version }}-$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Release APK
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          body: "Published at ${{ steps.date.outputs.date }}"
          name: "v${{ steps.version.outputs.version }} - ${{ steps.date.outputs.date }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
