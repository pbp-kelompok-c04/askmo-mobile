# This is a basic workflow to help you get started with Actions
name: Release

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [master]

# Permissions needed for creating releases
permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "Build and Release APK"
  releases:
    name: Build and Release APK
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: version
        run: echo "::set-output name=version::$(grep "version:" pubspec.yaml | cut -c10-)"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK (release, with Gemini + Google Client ID)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}


      - name: Create android/key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEY_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=release
          storeFile=app/release-keystore.jks
          EOF
      
      # - name: Decode Keystore
      #   run: echo "${{ secrets.KEY_JKS }}" | base64 -d > release-keystore.jks

      # - name: Sign APKs
      #   run: |
      #     for apk in build/app/outputs/flutter-apk/*.apk; do
      #       echo "Signing $apk..."
      #       jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
      #         -keystore release-keystore.jks \
      #         -storepass "${{ secrets.KEY_PASSWORD }}" \
      #         -keypass "${{ secrets.KEY_PASSWORD }}" \
      #         "$apk" release
      #     done

      - name: Verify signatures (apksigner)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "=== verifying $apk ==="
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          done
        
      - name: Cleanup Keystore
        if: always()
        run: rm -f release-keystore.jks
        
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(TZ='Asia/Jakarta' date +'%A %d-%m-%Y %T WIB')"

      - name: Generate unique tag
        id: tag
        run: echo "::set-output name=tag::v${{ steps.version.outputs.version }}-$(date +'%Y%m%d%H%M%S')"

      - name: Release APK
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          body: "Published at ${{ steps.date.outputs.date }}"
          name: "v${{ steps.version.outputs.version }} - ${{ steps.date.outputs.date }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
